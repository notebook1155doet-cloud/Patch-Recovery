name: RECOVERY

'on':
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'RECOVERY URL'
        required: true
        default: 'https://files.catbox.moe/17m8e6.img'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt install git wget lz4 tar openssl python3 -y

      - name: Fetch image from URL
        run: |
          wget "${{ github.event.inputs.RECOVERY_URL }}" -O recovery.img
          ls -lh recovery.img
          file recovery.img

      - name: Patch Process-1
        run: |
          chmod +x script1.sh
          chmod +x magiskboot
          ./script1.sh recovery.img || true

      - name: Patch Process-2
        run: |
          chmod +x script2.sh
          ./script2.sh || true

          echo "=== CHECK PATCHED IMAGE ==="
          ls -lh
          test -f r-patched.img

          echo "=== ADD AVB FOOTER ==="
          python3 avbtool extract_public_key \
            --key phh.pem \
            --output phh.pub.bin

          python3 avbtool add_hash_footer \
            --partition_name recovery \
            --partition_size "$(wc -c < recovery.img)" \
            --image r-patched.img \
            --key phh.pem \
            --algorithm SHA256_RSA4096

          mkdir -p output
          cp r-patched.img output/recovery.img

          cd output

          echo "=== CREATE USTAR TAR ==="

          tar \
            --format=ustar \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf fastbootd-recovery.tar \
            recovery.img

          echo "=== VERIFY TAR CONTENTS ==="
          tar --list --file=fastbootd-recovery.tar

          echo "=== VERIFY TAR FORMAT ==="
          file fastbootd-recovery.tar

          echo "=== CREATE MD5 ==="
          md5sum -t fastbootd-recovery.tar >> fastbootd-recovery.tar
          mv fastbootd-recovery.tar fastbootd-recovery.tar.md5

          echo "=== FINAL FILE ==="
          ls -lh fastbootd-recovery.tar.md5

      - name: Upload patched recovery
        uses: actions/upload-artifact@v4
        with:
          name: Fastbootd-patched-recovery-SM-A035M
          path: output/fastbootd-recovery.tar.md5
